{% extends "base.html" %}
{% block title %}Tags · {{ config.title }}{% endblock title %}
{% block content %}
<article class="page-body">
  <h1>Tags</h1>
  <ul class="tag-cloud">
    {% for term in terms %}
    <li><a class="tag" href="{{ term.permalink }}">#{{ term.name }}</a> <span class="count">{{ term.pages | length }}</span></li>
    {% endfor %}
  </ul>
</article>
{% endblock content %}
