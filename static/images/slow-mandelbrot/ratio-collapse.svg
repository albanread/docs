<svg viewBox="0 0 760 412" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="Dumbbell chart: Smalltalk-to-Dart time ratio per workload, before and after the fix. Before: dblCmp 12.3x, boundIvar 7.4x, mandel 5.1x, escLocal 4.6x, escIvar 3.7x, with loopCmp, nestIf, toDo and sumDbl already at 1.0x. After: every workload sits at the 1.0x parity line.">
  <rect x="0.5" y="0.5" width="759" height="411" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="32" font-size="14" font-weight="600" fill="#0b0b0b">Smalltalk / Dart time ratio, per workload</text>
  <text x="24" y="50" font-size="12" fill="#52514e">warmed best-of-5, arm64 &#183; 1&#215; = parity with hand-written Dart</text>

  <!-- legend -->
  <circle cx="484" cy="28" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="494" y="32" font-size="12" fill="#52514e">before (shared funnel)</text>
  <circle cx="632" cy="28" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <text x="642" y="32" font-size="12" fill="#52514e">after (per-site)</text>

  <!-- gridlines: 2x 4x 6x 8x 10x 12x -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="237.7" y1="76" x2="237.7" y2="372"/>
    <line x1="325.4" y1="76" x2="325.4" y2="372"/>
    <line x1="413.1" y1="76" x2="413.1" y2="372"/>
    <line x1="500.8" y1="76" x2="500.8" y2="372"/>
    <line x1="588.5" y1="76" x2="588.5" y2="372"/>
    <line x1="676.2" y1="76" x2="676.2" y2="372"/>
  </g>
  <!-- parity line at 1.0x -->
  <line x1="193.8" y1="76" x2="193.8" y2="372" stroke="#c3c2b7" stroke-width="1"/>
  <text x="193.8" y="70" font-size="11" fill="#898781" text-anchor="middle">1&#215; parity</text>

  <!-- axis tick labels -->
  <g font-size="11" fill="#898781" text-anchor="middle">
    <text x="237.7" y="390">2&#215;</text>
    <text x="325.4" y="390">4&#215;</text>
    <text x="413.1" y="390">6&#215;</text>
    <text x="500.8" y="390">8&#215;</text>
    <text x="588.5" y="390">10&#215;</text>
    <text x="676.2" y="390">12&#215;</text>
  </g>

  <!-- workload labels -->
  <g font-size="12" fill="#52514e" text-anchor="end">
    <text x="142" y="100">dblCmp</text>
    <text x="142" y="132">boundIvar</text>
    <text x="142" y="164">mandel</text>
    <text x="142" y="196">escLocal</text>
    <text x="142" y="228">escIvar</text>
    <text x="142" y="260">loopCmp</text>
    <text x="142" y="292">nestIf</text>
    <text x="142" y="324">toDo</text>
    <text x="142" y="356">sumDbl</text>
  </g>

  <!-- connectors (recessive), then before dots, then after dots on top -->
  <g stroke="#e1e0d9" stroke-width="2">
    <line x1="193.7" y1="96"  x2="689.2" y2="96"/>
    <line x1="194.2" y1="128" x2="476.2" y2="128"/>
    <line x1="195.0" y1="160" x2="373.6" y2="160"/>
    <line x1="194.6" y1="192" x2="353.4" y2="192"/>
    <line x1="193.7" y1="224" x2="310.0" y2="224"/>
  </g>
  <g fill="#2a78d6" stroke="#fcfcfb" stroke-width="2">
    <circle cx="689.2" cy="96"  r="5"/>
    <circle cx="476.2" cy="128" r="5"/>
    <circle cx="373.6" cy="160" r="5"/>
    <circle cx="353.4" cy="192" r="5"/>
    <circle cx="310.0" cy="224" r="5"/>
    <circle cx="194.2" cy="260" r="5"/>
    <circle cx="194.2" cy="292" r="5"/>
    <circle cx="194.2" cy="324" r="5"/>
    <circle cx="193.7" cy="356" r="5"/>
  </g>
  <g fill="#eb6834" stroke="#fcfcfb" stroke-width="2">
    <circle cx="193.7" cy="96"  r="5"/>
    <circle cx="194.2" cy="128" r="5"/>
    <circle cx="195.0" cy="160" r="5"/>
    <circle cx="194.6" cy="192" r="5"/>
    <circle cx="193.7" cy="224" r="5"/>
    <circle cx="194.2" cy="260" r="5"/>
    <circle cx="194.2" cy="292" r="5"/>
    <circle cx="194.2" cy="324" r="5"/>
    <circle cx="193.7" cy="356" r="5"/>
  </g>

  <!-- selective direct labels -->
  <text x="699" y="100" font-size="12" fill="#0b0b0b">12.3&#215;</text>
  <text x="383" y="164" font-size="12" fill="#0b0b0b">5.1&#215;</text>
  <text x="181" y="100" font-size="12" fill="#52514e" text-anchor="end">1.0&#215;</text>
</svg>
